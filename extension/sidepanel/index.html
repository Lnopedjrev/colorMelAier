<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorTweaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header>
        <h1><span>Color</span>Tweaker</h1>
        <div class="mode-switch" role="group" aria-label="Editing mode">
          <button id="mode-tab" class="active" type="button" aria-pressed="true">Current tab</button>
          <button id="mode-build" type="button" aria-pressed="false">Uploaded build</button>
        </div>
      </header>
      <section id="tab-panel" class="connection-card">
        <div class="tab-copy">
          <strong id="tab-title">Active tab</strong>
          <span id="tab-url"></span>
        </div>
        <div class="actions">
          <button id="attach" class="primary" type="button">Attach</button>
          <button id="refresh" type="button" disabled>Rescan</button>
          <button id="detach" type="button" disabled>Detach</button>
        </div>
        <div id="status" class="status" aria-live="polite">Not attached.</div>
        <button id="grant-access" class="permission" type="button" hidden></button>
        <details id="remote-failures" class="remote-failures" hidden>
          <summary>Remote stylesheet errors</summary>
          <div id="remote-failure-list"></div>
        </details>
      </section>
      <section id="build-panel" class="build-panel" hidden>
        <label id="build-drop-zone" class="build-drop-zone" for="build-files-input">
          <strong>Select a production build folder</strong>
          <span>HTML, CSS, JavaScript, fonts, and image assets stay local.</span>
        </label>
        <input id="build-files-input" type="file" webkitdirectory multiple hidden>
        <div id="build-file-summary" class="build-file-summary">No build selected.</div>
        <div class="build-actions">
          <button id="clear-build" type="button" disabled>Clear</button>
          <button id="show-build-preview" type="button" disabled>Show preview</button>
          <button id="load-build" class="primary" type="button" disabled>Load in preview tab</button>
        </div>
        <div id="build-status" class="status" aria-live="polite"></div>
      </section>
      <section id="scan-summary" class="summary" aria-label="Scan summary" hidden>
        <span><strong id="source-count">0</strong> sources</span>
        <span><strong id="color-count">0</strong> colors</span>
        <span><strong id="skipped-count">0</strong> skipped</span>
      </section>
      <details id="colors-panel" class="panel collapsible-panel" open hidden>
        <summary class="section-summary">
          <span>Colors</span>
          <span
            class="help-tip"
            role="img"
            tabindex="0"
            aria-label="About the Colors section"
            data-tooltip="Adjust discovered colors and opacity. Use Inspect or Frozen Inspect to locate a rendered color before editing it."
          >?</span>
        </summary>
        <div class="panel-actions" aria-label="Color tools">
          <button
            id="inspect"
            class="icon-button"
            type="button"
            aria-label="Inspect a rendered element's colors"
            aria-pressed="false"
            data-tooltip="Inspect a rendered element's colors"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
            </svg>
          </button>
          <button
            id="frozen-inspect"
            class="icon-button"
            type="button"
            aria-label="Inspect without normal page interaction"
            aria-pressed="false"
            data-tooltip="Inspect without normal page interaction"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2v20M4.2 6.5l15.6 11M19.8 6.5l-15.6 11M8.5 4l3.5 2 3.5-2M8.5 20l3.5-2 3.5 2M3 10l3 2-3 2M21 10l-3 2 3 2"></path>
            </svg>
          </button>
          <button
            id="export-css"
            class="icon-button"
            type="button"
            aria-label="Export the processed CSS"
            data-tooltip="Export the processed CSS"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12M8 11l4 4 4-4M5 20h14"></path>
            </svg>
          </button>
          <button id="reset" type="button" disabled>Reset all</button>
        </div>
        <div id="color-list" class="color-list empty">Attach to a page to scan its colors.</div>
      </details>
      <details id="sources-panel" class="sources-panel collapsible-panel" hidden>
        <summary class="section-summary">
          <span>CSS sources</span>
          <span
            class="help-tip"
            role="img"
            tabindex="0"
            aria-label="About the CSS sources section"
            data-tooltip="Review the stylesheets and inline styles found on the page. Select a source, edit its CSS, and apply the change to the preview."
          >?</span>
        </summary>
        <div id="source-list" class="source-list"></div>
        <div class="source-editor">
          <label for="source-select">Edit source</label>
          <select id="source-select" disabled></select>
          <textarea id="source-editor" spellcheck="false" disabled></textarea>
          <div class="source-editor-actions">
            <button id="reload-source" type="button" disabled>Discard field edits</button>
            <button id="apply-source" class="primary" type="button" disabled>Apply source</button>
          </div>
        </div>
      </details>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
