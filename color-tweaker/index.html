<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorTweaker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <h1><span>Color</span>Tweaker</h1>
    <div class="toolbar">
      <details class="recording-settings">
        <summary class="btn" title="Recording settings">FPS</summary>
        <div class="recording-settings-popover">
          <label for="recording-fps">Capture frame rate</label>
          <div class="recording-fps-input">
            <input id="recording-fps" type="number" min="1" max="60" step="1" value="30" aria-describedby="recording-fps-note">
            <span>FPS</span>
          </div>
          <p id="recording-fps-note">Above 30 FPS can increase encoder load and may reduce smoothness or output quality.</p>
          <label class="recording-endpoint-label" for="recording-score-endpoint">Scoring endpoint <span>(optional)</span></label>
          <input class="recording-endpoint" id="recording-score-endpoint" type="text" inputmode="url" placeholder="/api/score">
          <p class="recording-endpoint-note">Sends a multipart POST with <code>video</code> and <code>fps</code> fields.</p>
        </div>
      </details>
      <button class="btn" id="btn-record-preview" title="Choose this tab in the browser capture dialog">Record 5s</button>
      <output class="recording-score" id="recording-score" aria-live="polite" hidden></output>
      <button class="btn" id="btn-export-css">Export CSS</button>
      <button class="btn" id="btn-export-html">Export HTML</button>
    </div>
  </header>
  <main>
    <div class="editor-panel">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="html">HTML</button>
        <button class="tab" data-tab="css">CSS</button>
        <button class="tab" data-tab="js">JS</button>
        <button class="tab" data-tab="upload">Upload</button>
      </div>
      <div class="editor-wrap">
        <textarea id="ed-html" spellcheck="false"></textarea>
        <textarea id="ed-css" class="hidden" spellcheck="false"></textarea>
        <textarea id="ed-js" class="hidden" spellcheck="false"></textarea>

        <div id="panel-upload" class="panel hidden">
          <div class="url-loader">
            <label for="site-url">Website URL</label>
            <div class="url-loader-row">
              <input type="url" id="site-url" placeholder="https://example.com" autocomplete="url">
              <button class="btn-load btn-load-url" id="btn-load-url">Load URL</button>
            </div>
            <div class="load-status" id="url-status" aria-live="polite"></div>
          </div>
          <div class="upload-divider"><span>or load a local build</span></div>
          <div class="drop-zone" id="drop-zone">
            <p>Drop <code>dist/</code> folder here or click to browse</p>
            <input type="file" id="file-input" webkitdirectory multiple hidden>
          </div>
          <div class="file-chips" id="build-files"></div>
          <button class="btn-load" id="btn-load" disabled>Load Build</button>
        </div>
      </div>
      <div class="color-panel">
        <div class="cp-head">
          <h3>Parsed Colors</h3>
          <div class="cp-head-right">
            <span class="pill" id="cp-count">0</span>
            <button class="btn-reset" id="btn-inspect-color" aria-pressed="false">Inspect</button>
            <button class="btn-reset" id="btn-frozen-inspect-color" aria-pressed="false">Frozen Inspect</button>
            <button class="btn-reset" id="btn-reset">Reset</button>
          </div>
        </div>
        <div class="color-list" id="color-list"></div>
      </div>
    </div>
    <div class="preview-panel">
      <div class="preview-head"><h3>Preview</h3></div>
      <div class="preview-surface">
        <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        <div id="frozen-inspector-overlay" class="frozen-inspector-overlay" hidden></div>
      </div>
    </div>
  </main>
</div>
<button class="recording-stop" id="btn-stop-recording" type="button" aria-label="Stop recording" title="Stop recording" hidden>
  <span aria-hidden="true"></span>
</button>
<script type="module" src="js/app.js"></script>
</body>
</html>
