<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorTweaker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface-2:#21262d;
  --border:#30363d;--text:#c9d1d9;--text-muted:#8b949e;
  --accent:#58a6ff;--green:#7ee787;--purple:#d2a8ff;
  --mono:Consolas,Monaco,'Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text)}

#app{display:flex;flex-direction:column;height:100vh}

header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:44px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
header h1{font-size:14px;font-weight:600}
header h1 span{color:var(--accent)}

.toolbar{display:flex;gap:6px}
.btn{
  padding:4px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:12px;
  cursor:pointer;font-family:var(--sans);
}
.btn:hover{border-color:var(--accent)}

main{display:flex;flex:1;min-height:0}

.editor-panel{
  width:440px;flex-shrink:0;display:flex;flex-direction:column;
  border-right:1px solid var(--border);
}
.preview-panel{flex:1;display:flex;flex-direction:column}

.tabs{
  display:flex;background:var(--surface);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.tab{
  padding:8px 16px;font-size:12px;color:var(--text-muted);
  cursor:pointer;border:none;border-bottom:2px solid transparent;
  background:none;font-family:var(--sans);
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.editor-wrap{flex:1;min-height:0;position:relative}
.editor-wrap textarea{
  position:absolute;inset:0;width:100%;height:100%;
  background:var(--bg);color:var(--text);border:none;
  padding:12px;font-family:var(--mono);font-size:13px;
  line-height:1.6;resize:none;outline:none;tab-size:2;
}
.editor-wrap textarea.hidden{display:none}

.color-panel{
  border-top:1px solid var(--border);
  max-height:300px;overflow-y:auto;flex-shrink:0;
}
.cp-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px;background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:1;
}
.cp-head h3{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-muted);
}
.cp-head-right{display:flex;align-items:center;gap:6px}
.pill{
  font-size:11px;color:var(--text-muted);
  background:var(--surface-2);padding:2px 7px;border-radius:10px;
}
.btn-reset{
  font-size:11px;padding:2px 8px;border-radius:4px;
  border:1px solid var(--border);background:var(--surface-2);
  color:var(--text-muted);cursor:pointer;font-family:var(--sans);
}
.btn-reset:hover{color:var(--text);border-color:var(--text-muted)}

.color-list{padding:2px 0}
.color-entry{
  display:flex;align-items:center;gap:8px;padding:5px 12px;
  transition:background .1s;
}
.color-entry:hover{background:var(--surface)}

.swatch{
  width:24px;height:24px;border-radius:5px;
  border:1px solid var(--border);flex-shrink:0;
  background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),
    linear-gradient(-45deg,#ccc 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ccc 75%),
    linear-gradient(-45deg,transparent 75%,#ccc 75%);
  background-size:8px 8px;
  background-position:0 0,0 4px,4px -4px,-4px 0;
}
.swatch-inner{
  width:100%;height:100%;border-radius:4px;
}

.c-info{flex:1;min-width:0}
.c-value{
  font-family:var(--mono);font-size:12px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.c-meta{display:flex;align-items:center;gap:4px;margin-top:1px}
.badge{
  font-size:10px;padding:1px 5px;border-radius:3px;
  background:var(--surface-2);color:var(--text-muted);
  border:1px solid var(--border);
}
.badge.v{color:var(--green);border-color:#238636}
.badge.n{color:var(--purple);border-color:#8957e5}
.c-count{font-size:10px;color:var(--text-muted)}

.picker-wrap{position:relative;width:28px;height:28px;flex-shrink:0}
.picker-wrap input[type="color"]{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;padding:0;cursor:pointer;background:transparent;
  border-radius:4px;
}
.picker-wrap input[type="color"]::-webkit-color-swatch-wrapper{padding:2px}
.picker-wrap input[type="color"]::-webkit-color-swatch{border-radius:3px;border:1px solid var(--border)}

.alpha-row{
  display:flex;align-items:center;gap:6px;
  padding:2px 12px 6px 44px;
}
.alpha-row label{font-size:10px;color:var(--text-muted);white-space:nowrap;min-width:18px;text-align:right}
.alpha-row input[type="range"]{
  flex:1;height:4px;-webkit-appearance:none;appearance:none;
  background:var(--surface-2);border-radius:2px;outline:none;cursor:pointer;
}
.alpha-row input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);cursor:pointer;
}
.alpha-row input[type="range"]::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);cursor:pointer;
}

.preview-head{
  display:flex;align-items:center;padding:6px 16px;
  background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;
}
.preview-head h3{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;color:var(--text-muted);
}
.preview-panel iframe{flex:1;border:none;background:#fff;width:100%}

.empty{padding:20px 12px;text-align:center;color:var(--text-muted);font-size:12px}

.panel{position:absolute;inset:0;overflow-y:auto;padding:12px;background:var(--bg)}
.panel.hidden{display:none}
.hidden{display:none}

.drop-zone{
  border:2px dashed var(--border);border-radius:8px;padding:28px 16px;
  text-align:center;cursor:pointer;transition:border-color .2s;
}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent)}
.drop-zone p{font-size:12px;color:var(--text-muted)}
.drop-zone code{color:var(--accent);font-family:var(--mono)}

.upload-section{margin-top:12px}
.upload-section label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.upload-section input[type="file"]{font-size:12px;color:var(--text-muted)}

.file-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.file-chip{
  font-size:10px;padding:2px 8px;border-radius:4px;
  background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);
}
.file-chip.ts{color:var(--accent);border-color:var(--accent)}

.btn-load{
  margin-top:12px;width:100%;padding:8px;border-radius:6px;border:1px solid var(--accent);
  background:transparent;color:var(--accent);font-size:12px;font-weight:500;
  cursor:pointer;font-family:var(--sans);transition:all .15s;
}
.btn-load:hover{background:var(--accent);color:var(--bg)}
.btn-load:disabled{opacity:.4;cursor:default;background:transparent;color:var(--accent)}

.mock-endpoint{
  margin-bottom:10px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);overflow:hidden;
}
.mock-head{
  display:flex;align-items:center;gap:6px;padding:6px 10px;
  background:var(--surface-2);font-size:12px;
}
.mock-method{font-weight:700;color:var(--accent);font-family:var(--mono)}
.mock-url{color:var(--text);font-family:var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mock-status{font-size:10px;padding:1px 6px;border-radius:3px;background:#da363340;color:#f85149}
.mock-status.ok{background:#23863640;color:var(--green)}
.type-select{
  font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:var(--sans);cursor:pointer;
}
.mock-body textarea{
  width:100%;min-height:60px;border:none;padding:8px 10px;
  background:var(--bg);color:var(--text);font-family:var(--mono);
  font-size:12px;line-height:1.5;resize:vertical;outline:none;
}
.btn-apply-mocks{
  margin-top:8px;width:100%;padding:8px;border-radius:6px;border:1px solid var(--green);
  background:transparent;color:var(--green);font-size:12px;font-weight:500;
  cursor:pointer;font-family:var(--sans);transition:all .15s;
}
.btn-apply-mocks:hover{background:var(--green);color:var(--bg)}
.mock-count-badge{
  font-size:10px;padding:1px 5px;border-radius:8px;
  background:#da363340;color:#f85149;margin-left:4px;
}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span>Color</span>Tweaker</h1>
    <div class="toolbar">
      <button class="btn" id="btn-export-css">Export CSS</button>
      <button class="btn" id="btn-export-html">Export HTML</button>
    </div>
  </header>
  <main>
    <div class="editor-panel">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="html">HTML</button>
        <button class="tab" data-tab="css">CSS</button>
        <button class="tab" data-tab="js">JS</button>
        <button class="tab" data-tab="upload">Upload</button>
        <button class="tab" data-tab="mocks">Mocks<span id="mock-badge"></span></button>
      </div>
      <div class="editor-wrap">
        <textarea id="ed-html" spellcheck="false"></textarea>
        <textarea id="ed-css" class="hidden" spellcheck="false"></textarea>
        <textarea id="ed-js" class="hidden" spellcheck="false"></textarea>

        <div id="panel-upload" class="panel hidden">
          <div class="drop-zone" id="drop-zone">
            <p>Drop <code>dist/</code> folder here or click to browse</p>
            <input type="file" id="file-input" webkitdirectory multiple hidden>
          </div>
          <div class="file-chips" id="build-files"></div>
          <div class="upload-section">
            <label>TypeScript types (optional)</label>
            <input type="file" id="ts-input" accept=".ts,.d.ts" multiple>
          </div>
          <div class="file-chips" id="ts-files"></div>
          <button class="btn-load" id="btn-load" disabled>Load Build</button>
        </div>

        <div id="panel-mocks" class="panel hidden">
          <div id="mocks-list"><div class="empty">No failed requests captured yet</div></div>
          <button class="btn-apply-mocks hidden" id="btn-apply-mocks">Apply Mocks &amp; Reload</button>
        </div>
      </div>
      <div class="color-panel">
        <div class="cp-head">
          <h3>Parsed Colors</h3>
          <div class="cp-head-right">
            <span class="pill" id="cp-count">0</span>
            <button class="btn-reset" id="btn-reset">Reset</button>
          </div>
        </div>
        <div class="color-list" id="color-list"></div>
      </div>
    </div>
    <div class="preview-panel">
      <div class="preview-head"><h3>Preview</h3></div>
      <iframe id="preview" sandbox="allow-scripts"></iframe>
    </div>
  </main>
</div>
<script>
(function () {
  'use strict';

  // ---- Named CSS Colors (full set for accurate detection) ----
  const NAMED = new Set([
    'aliceblue','antiquewhite','aqua','aquamarine','azure','beige','bisque','black',
    'blanchedalmond','blue','blueviolet','brown','burlywood','cadetblue','chartreuse',
    'chocolate','coral','cornflowerblue','cornsilk','crimson','cyan','darkblue',
    'darkcyan','darkgoldenrod','darkgray','darkgreen','darkgrey','darkkhaki',
    'darkmagenta','darkolivegreen','darkorange','darkorchid','darkred','darksalmon',
    'darkseagreen','darkslateblue','darkslategray','darkslategrey','darkturquoise',
    'darkviolet','deeppink','deepskyblue','dimgray','dimgrey','dodgerblue','firebrick',
    'floralwhite','forestgreen','fuchsia','gainsboro','ghostwhite','gold','goldenrod',
    'gray','green','greenyellow','grey','honeydew','hotpink','indianred','indigo',
    'ivory','khaki','lavender','lavenderblush','lawngreen','lemonchiffon','lightblue',
    'lightcoral','lightcyan','lightgoldenrodyellow','lightgray','lightgreen','lightgrey',
    'lightpink','lightsalmon','lightseagreen','lightskyblue','lightslategray',
    'lightslategrey','lightsteelblue','lightyellow','lime','limegreen','linen','magenta',
    'maroon','mediumaquamarine','mediumblue','mediumorchid','mediumpurple',
    'mediumseagreen','mediumslateblue','mediumspringgreen','mediumturquoise',
    'mediumvioletred','midnightblue','mintcream','mistyrose','moccasin','navajowhite',
    'navy','oldlace','olive','olivedrab','orange','orangered','orchid','palegoldenrod',
    'palegreen','paleturquoise','palevioletred','papayawhip','peachpuff','peru','pink',
    'plum','powderblue','purple','rebeccapurple','red','rosybrown','royalblue',
    'saddlebrown','salmon','sandybrown','seagreen','seashell','sienna','silver',
    'skyblue','slateblue','slategray','slategrey','snow','springgreen','steelblue',
    'tan','teal','thistle','tomato','turquoise','violet','wheat','white','whitesmoke',
    'yellow','yellowgreen'
  ]);

  const SKIP = new Set([
    'transparent','currentcolor','inherit','initial','unset','revert','none'
  ]);

  // ---- Color Utilities ----
  const _ctx = document.createElement('canvas').getContext('2d');

  function isValidColor(str) {
    if (!str || SKIP.has(str.toLowerCase().trim())) return false;
    const s = new Option().style;
    s.color = str.trim();
    return s.color !== '';
  }

  function toCanonical(color) {
    if (!isValidColor(color)) return null;
    _ctx.fillStyle = '#000000';
    _ctx.fillStyle = color.trim();
    return _ctx.fillStyle;
  }

  function canonicalToHex6(c) {
    if (c.startsWith('#')) return c;
    const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (m) return '#' + [m[1], m[2], m[3]].map(v => parseInt(v).toString(16).padStart(2, '0')).join('');
    return '#000000';
  }

  function hasAlpha(str) {
    return /rgba|hsla/i.test(str) || /^#[0-9a-f]{4}([0-9a-f]{4})?$/i.test(str);
  }

  function extractAlpha(str) {
    const m = str.match(/,\s*([\d.]+)\s*\)\s*$/);
    return m ? parseFloat(m[1]) : null;
  }

  function hexToRgba(hex6, alpha) {
    const r = parseInt(hex6.slice(1, 3), 16);
    const g = parseInt(hex6.slice(3, 5), 16);
    const b = parseInt(hex6.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function debounce(fn, ms) {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  }

  // ---- CSS Color Parser ----
  function extractColors(css) {
    const found = new Map();

    function add(original, type, name) {
      const canon = toCanonical(original);
      if (!canon) return;
      if (found.has(canon)) {
        const e = found.get(canon);
        e.originals.add(original);
        e.count++;
        if (type === 'variable' && !e.name) { e.name = name; e.type = 'variable'; }
      } else {
        found.set(canon, {
          canonical: canon,
          hex6: canonicalToHex6(canon),
          originals: new Set([original]),
          type, name: name || null, count: 1
        });
      }
    }

    let m;

    const varRe = /(--[\w-]+)\s*:\s*([^;}\n]+)/g;
    while ((m = varRe.exec(css)) !== null) {
      const val = m[2].trim();
      if (isValidColor(val)) add(val, 'variable', m[1]);
    }

    const hexRe = /#[0-9a-fA-F]{3,8}\b/g;
    while ((m = hexRe.exec(css)) !== null) add(m[0], 'inline');

    const rgbRe = /rgba?\([^)]+\)/gi;
    while ((m = rgbRe.exec(css)) !== null) add(m[0], 'inline');

    const hslRe = /hsla?\([^)]+\)/gi;
    while ((m = hslRe.exec(css)) !== null) add(m[0], 'inline');

    const declRe = /[\w-]+\s*:\s*([^;}\n]+)/g;
    while ((m = declRe.exec(css)) !== null) {
      const words = m[1].match(/\b[a-zA-Z]+\b/g) || [];
      for (const w of words) {
        if (NAMED.has(w.toLowerCase())) add(w, 'named');
      }
    }

    const entries = Array.from(found.values());
    entries.sort((a, b) => {
      if (a.type === 'variable' && b.type !== 'variable') return -1;
      if (a.type !== 'variable' && b.type === 'variable') return 1;
      return b.count - a.count;
    });
    return entries;
  }

  // ---- State ----
  let colorEntries = [];
  const replacements = new Map();
  const alphaOverrides = new Map();

  function entryHasAlpha(entry) {
    for (const orig of entry.originals) {
      if (extractAlpha(orig) !== null) return true;
    }
    return false;
  }

  function getEntryAlpha(entry) {
    if (alphaOverrides.has(entry.canonical)) return alphaOverrides.get(entry.canonical);
    for (const orig of entry.originals) {
      const a = extractAlpha(orig);
      if (a !== null) return a;
    }
    return 1;
  }

  // ---- DOM ----
  const ed = {
    html: document.getElementById('ed-html'),
    css: document.getElementById('ed-css'),
    js: document.getElementById('ed-js')
  };
  const preview = document.getElementById('preview');
  const colorList = document.getElementById('color-list');
  const cpCount = document.getElementById('cp-count');

  // ---- Tabs ----
  const panelUpload = document.getElementById('panel-upload');
  const panelMocks = document.getElementById('panel-mocks');

  document.getElementById('tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const key = tab.dataset.tab;
    Object.keys(ed).forEach(k => ed[k].classList.add('hidden'));
    panelUpload.classList.add('hidden');
    panelMocks.classList.add('hidden');
    if (ed[key]) ed[key].classList.remove('hidden');
    else if (key === 'upload') panelUpload.classList.remove('hidden');
    else if (key === 'mocks') panelMocks.classList.remove('hidden');
  });

  // ---- Tab key in textareas ----
  Object.values(ed).forEach(textarea => {
    textarea.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = textarea.selectionStart;
        const end = textarea.selectionEnd;
        textarea.value = textarea.value.substring(0, s) + '  ' + textarea.value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = s + 2;
        textarea.dispatchEvent(new Event('input'));
      }
    });
  });

  // ---- Build Replacement Value ----
  function buildReplacement(originals, newHex6, alphaOverride) {
    const results = new Map();
    for (const orig of originals) {
      const origAlpha = extractAlpha(orig);
      const alpha = alphaOverride !== undefined ? alphaOverride : origAlpha;
      if (alpha !== null && alpha < 1) {
        results.set(orig, hexToRgba(newHex6, alpha));
      } else if (origAlpha !== null && alphaOverride !== undefined) {
        results.set(orig, hexToRgba(newHex6, alpha));
      } else {
        results.set(orig, newHex6);
      }
    }
    return results;
  }

  // ---- Process CSS ----
  function getProcessedCss() {
    let css = ed.css.value;
    for (const [canon, newHex6] of replacements) {
      const entry = colorEntries.find(e => e.canonical === canon);
      if (!entry) continue;
      const alphaOv = alphaOverrides.has(canon) ? alphaOverrides.get(canon) : undefined;
      const mapping = buildReplacement(entry.originals, newHex6, alphaOv);
      for (const [orig, replacement] of mapping) {
        if (/^[a-zA-Z]+$/.test(orig)) {
          css = css.replace(new RegExp('\\b' + orig + '\\b', 'gi'), replacement);
        } else {
          css = css.split(orig).join(replacement);
        }
      }
    }
    return css;
  }

  // ---- Preview ----
  const IFRAME_LISTENER = `window.addEventListener('message',function(e){
    if(e.data&&e.data.type==='css-update'){
      var s=document.getElementById('__ct');if(s)s.textContent=e.data.css;
    }
  });`;

  function updatePreview() {
    const css = getProcessedCss();
    preview.srcdoc = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<style id="__ct">' + css + '</style></head><body>' +
      ed.html.value +
      '<script>' + IFRAME_LISTENER + '<\/script>' +
      '<script>' + ed.js.value + '<\/script></body></html>';
  }

  function patchCss() {
    if (preview.contentWindow) {
      preview.contentWindow.postMessage({ type: 'css-update', css: getProcessedCss() }, '*');
    }
  }

  // ---- Color Panel ----
  function renderColorPanel() {
    cpCount.textContent = colorEntries.length;
    if (!colorEntries.length) {
      colorList.innerHTML = '<div class="empty">No colors detected in CSS</div>';
      return;
    }

    colorList.innerHTML = colorEntries.map((entry, i) => {
      const currentHex = replacements.has(entry.canonical)
        ? replacements.get(entry.canonical)
        : entry.hex6;
      const label = entry.name || Array.from(entry.originals)[0];
      const badgeCls = entry.type === 'variable' ? 'v' : entry.type === 'named' ? 'n' : '';
      const badgeLabel = entry.type === 'variable' ? 'var' : entry.type === 'named' ? 'named' : 'inline';
      const alpha = getEntryAlpha(entry);
      const showAlpha = entryHasAlpha(entry);
      const swatchColor = showAlpha ? hexToRgba(currentHex, alpha) : currentHex;

      let html = `<div class="color-entry" data-idx="${i}">
        <div class="swatch"><div class="swatch-inner" style="background:${swatchColor}"></div></div>
        <div class="c-info">
          <div class="c-value" title="${Array.from(entry.originals).join(', ')}">${label}</div>
          <div class="c-meta">
            <span class="badge ${badgeCls}">${badgeLabel}</span>
            <span class="c-count">${entry.count}x</span>
          </div>
        </div>
        <div class="picker-wrap">
          <input type="color" value="${currentHex}" data-idx="${i}">
        </div>
      </div>`;
      if (showAlpha) {
        html += `<div class="alpha-row" data-idx="${i}">
          <label>${Math.round(alpha * 100)}%</label>
          <input type="range" min="0" max="1" step="0.01" value="${alpha}" data-idx="${i}">
        </div>`;
      }
      return html;
    }).join('');

    colorList.querySelectorAll('input[type="color"]').forEach(input => {
      input.addEventListener('input', onColorPick);
    });
    colorList.querySelectorAll('.alpha-row input[type="range"]').forEach(input => {
      input.addEventListener('input', onAlphaPick);
    });
  }

  function updateSwatch(idx) {
    const entry = colorEntries[idx];
    const hex = replacements.has(entry.canonical) ? replacements.get(entry.canonical) : entry.hex6;
    const alpha = getEntryAlpha(entry);
    const color = entryHasAlpha(entry) ? hexToRgba(hex, alpha) : hex;
    const row = colorList.querySelector(`.color-entry[data-idx="${idx}"]`);
    if (row) row.querySelector('.swatch-inner').style.background = color;
  }

  function onColorPick(e) {
    const idx = parseInt(e.target.dataset.idx);
    const entry = colorEntries[idx];
    replacements.set(entry.canonical, e.target.value);
    updateSwatch(idx);
    patchCss();
  }

  function onAlphaPick(e) {
    const idx = parseInt(e.target.dataset.idx);
    const entry = colorEntries[idx];
    const alpha = parseFloat(e.target.value);
    alphaOverrides.set(entry.canonical, alpha);
    const label = e.target.closest('.alpha-row').querySelector('label');
    label.textContent = Math.round(alpha * 100) + '%';
    if (!replacements.has(entry.canonical)) replacements.set(entry.canonical, entry.hex6);
    updateSwatch(idx);
    patchCss();
  }

  // ---- Parse + Refresh ----
  function parseAndRefresh() {
    colorEntries = extractColors(ed.css.value);
    replacements.clear();
    alphaOverrides.clear();
    renderColorPanel();
    updatePreview();
  }

  const debouncedParse = debounce(parseAndRefresh, 300);
  const debouncedPreview = debounce(updatePreview, 200);

  ed.css.addEventListener('input', debouncedParse);
  ed.html.addEventListener('input', debouncedPreview);
  ed.js.addEventListener('input', debouncedPreview);

  // ---- Reset ----
  document.getElementById('btn-reset').addEventListener('click', () => {
    replacements.clear();
    alphaOverrides.clear();
    renderColorPanel();
    patchCss();
  });

  // ---- Export ----
  function download(content, filename, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  document.getElementById('btn-export-css').addEventListener('click', () => {
    download(getProcessedCss(), 'styles.css', 'text/css');
  });

  document.getElementById('btn-export-html').addEventListener('click', () => {
    const full = '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\n' +
      getProcessedCss() + '\n</style>\n</head>\n<body>\n' +
      ed.html.value + '\n<script>\n' + ed.js.value + '\n<\/script>\n</body>\n</html>';
    download(full, 'index.html', 'text/html');
  });

  // ---- Build Upload ----
  const buildFileMap = new Map();
  let parsedTsTypes = {};
  const failedEndpoints = new Map();
  const mockData = {};

  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const tsInput = document.getElementById('ts-input');
  const btnLoad = document.getElementById('btn-load');
  const buildFilesEl = document.getElementById('build-files');
  const tsFilesEl = document.getElementById('ts-files');
  const mocksList = document.getElementById('mocks-list');
  const btnApplyMocks = document.getElementById('btn-apply-mocks');
  const mockBadge = document.getElementById('mock-badge');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('over');
    handleBuildFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', (e) => handleBuildFiles(e.target.files));

  async function handleBuildFiles(fileList) {
    buildFileMap.clear();
    for (const f of fileList) {
      const path = '/' + f.webkitRelativePath.split('/').slice(1).join('/');
      buildFileMap.set(path, f);
    }
    buildFilesEl.innerHTML = Array.from(buildFileMap.keys())
      .slice(0, 30)
      .map(p => `<span class="file-chip">${p}</span>`)
      .join('') + (buildFileMap.size > 30 ? `<span class="file-chip">+${buildFileMap.size - 30} more</span>` : '');
    btnLoad.disabled = false;
  }

  tsInput.addEventListener('change', async (e) => {
    parsedTsTypes = {};
    tsFilesEl.innerHTML = '';
    const chips = [];
    for (const f of e.target.files) {
      const text = await f.text();
      const types = parseTypeScript(text);
      Object.assign(parsedTsTypes, types);
      chips.push(`<span class="file-chip ts">${f.name} (${Object.keys(types).length} types)</span>`);
    }
    tsFilesEl.innerHTML = chips.join('');
  });

  btnLoad.addEventListener('click', () => loadBuild());

  // ---- TypeScript Parser ----
  function parseTypeScript(code) {
    code = code.replace(/\/\/.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '');
    const types = {};
    const re = /(?:export\s+)?(?:interface|type)\s+(\w+)(?:<[^>]*>)?\s*=?\s*\{/g;
    let m;
    while ((m = re.exec(code)) !== null) {
      const name = m[1];
      let depth = 1, i = m.index + m[0].length;
      while (i < code.length && depth > 0) {
        if (code[i] === '{') depth++;
        else if (code[i] === '}') depth--;
        i++;
      }
      types[name] = parseTypeBody(code.substring(m.index + m[0].length, i - 1));
    }
    return types;
  }

  function parseTypeBody(body) {
    const result = {};
    const lines = body.split(/[;\n]/).map(l => l.trim()).filter(Boolean);
    for (const line of lines) {
      const pm = line.match(/^(\w+)\??\s*:\s*(.+)$/);
      if (!pm) continue;
      let typeStr = pm[2].trim();
      if (typeStr.endsWith(',')) typeStr = typeStr.slice(0, -1).trim();
      result[pm[1]] = typeStr;
    }
    return result;
  }

  function generateMock(typeStr, allTypes, depth) {
    if ((depth || 0) > 5) return null;
    typeStr = typeStr.trim();
    if (typeStr === 'string') return 'sample';
    if (typeStr === 'number') return 1;
    if (typeStr === 'boolean') return true;
    if (typeStr === 'null' || typeStr === 'undefined') return null;
    if (typeStr === 'any' || typeStr === 'unknown' || typeStr === 'object') return {};
    if (typeStr.endsWith('[]')) return [generateMock(typeStr.slice(0, -2), allTypes, (depth||0)+1)];
    const arrM = typeStr.match(/^Array<(.+)>$/);
    if (arrM) return [generateMock(arrM[1], allTypes, (depth||0)+1)];
    if (typeStr.includes('|')) {
      const parts = typeStr.split('|').map(s => s.trim()).filter(s => s !== 'null' && s !== 'undefined');
      return generateMock(parts[0] || 'null', allTypes, (depth||0)+1);
    }
    if (allTypes[typeStr]) {
      const obj = {};
      for (const [k, v] of Object.entries(allTypes[typeStr]))
        obj[k] = generateMock(v, allTypes, (depth||0)+1);
      return obj;
    }
    if (typeStr.startsWith('{') && typeStr.endsWith('}')) {
      const inner = parseTypeBody(typeStr.slice(1, -1));
      const obj = {};
      for (const [k, v] of Object.entries(inner))
        obj[k] = generateMock(v, allTypes, (depth||0)+1);
      return obj;
    }
    return null;
  }

  function generateMockForType(typeName) {
    if (!parsedTsTypes[typeName]) return null;
    const obj = {};
    for (const [k, v] of Object.entries(parsedTsTypes[typeName]))
      obj[k] = generateMock(v, parsedTsTypes, 0);
    return obj;
  }

  // ---- Build Loading ----
  function findFileByHref(href) {
    if (!href) return null;
    const name = href.split('/').pop().split('?')[0];
    for (const [path, file] of buildFileMap) {
      if (path.endsWith('/' + name) || path === '/' + name) return file;
    }
    return null;
  }

  function buildCaptureScript(mocks) {
    var s = '(function(){';
    s += 'var __MOCKS__=' + JSON.stringify(mocks) + ';';
    s += 'var _f=window.fetch;';
    s += 'window.fetch=function(input,init){';
    s += 'var url=typeof input==="string"?input:(input&&input.url)||String(input);';
    s += 'var method=((init&&init.method)||"GET").toUpperCase();';
    s += 'var key=method+" "+url;';
    s += 'if(__MOCKS__[key]!==undefined){';
    s += 'return Promise.resolve(new Response(JSON.stringify(__MOCKS__[key]),';
    s += '{status:200,headers:{"Content-Type":"application/json"}}));}';
    s += 'return _f.call(window,input,init).then(function(res){';
    s += 'if(!res.ok){window.parent.postMessage({type:"ct-fetch-fail",url:url,method:method,status:res.status},"*");}';
    s += 'return res;';
    s += '}).catch(function(err){';
    s += 'window.parent.postMessage({type:"ct-fetch-fail",url:url,method:method,error:err.message},"*");';
    s += 'return new Response("null",{status:0,headers:{"Content-Type":"application/json"}});});};';
    s += 'window.addEventListener("error",function(e){';
    s += 'window.parent.postMessage({type:"ct-runtime-error",message:e.message,filename:e.filename,lineno:e.lineno},"*");});';
    s += 'window.addEventListener("unhandledrejection",function(e){';
    s += 'window.parent.postMessage({type:"ct-unhandled-rejection",reason:String(e.reason)},"*");});';
    s += '})();';
    return s;
  }

  async function loadBuild() {
    failedEndpoints.clear();
    Object.keys(mockData).forEach(k => delete mockData[k]);
    updateMockBadge();

    let htmlFile = buildFileMap.get('/index.html');
    if (!htmlFile) {
      for (const [, file] of buildFileMap) {
        if (file.name.endsWith('.html')) { htmlFile = file; break; }
      }
    }
    if (!htmlFile) { alert('No index.html found in uploaded files'); return; }

    const htmlText = await htmlFile.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlText, 'text/html');

    let allCss = '';

    const links = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));
    for (const link of links) {
      const file = findFileByHref(link.getAttribute('href'));
      if (file) {
        const content = await file.text();
        allCss += content + '\n';
        const style = doc.createElement('style');
        style.textContent = content;
        link.replaceWith(style);
      }
    }

    const scripts = Array.from(doc.querySelectorAll('script[src]'));
    for (const script of scripts) {
      const file = findFileByHref(script.getAttribute('src'));
      if (file) {
        const content = await file.text();
        const inline = doc.createElement('script');
        if (script.type) inline.type = script.type;
        inline.textContent = content;
        script.replaceWith(inline);
      }
    }

    const captureEl = doc.createElement('script');
    captureEl.textContent = buildCaptureScript(mockData);
    doc.head.insertBefore(captureEl, doc.head.firstChild);

    const iframeListener = doc.createElement('script');
    iframeListener.textContent = 'window.addEventListener("message",function(e){' +
      'if(e.data&&e.data.type==="css-update"){' +
      'var s=document.getElementById("__ct");if(s)s.textContent=e.data.css;}});';
    doc.head.insertBefore(iframeListener, doc.head.firstChild);

    const allStyles = doc.querySelectorAll('style');
    if (allStyles.length > 0) {
      allStyles[0].id = '__ct';
    }

    ed.css.value = allCss;
    parseAndRefresh();

    preview.srcdoc = '<!DOCTYPE html>' + doc.documentElement.outerHTML;
  }

  // ---- Mock Panel ----
  window.addEventListener('message', (e) => {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'ct-fetch-fail') {
      const key = e.data.method + ' ' + e.data.url;
      if (failedEndpoints.has(key)) return;
      failedEndpoints.set(key, {
        method: e.data.method,
        url: e.data.url,
        status: e.data.status,
        error: e.data.error
      });
      renderMocksPanel();
      updateMockBadge();
    }
  });

  function updateMockBadge() {
    const n = failedEndpoints.size;
    mockBadge.innerHTML = n ? `<span class="mock-count-badge">${n}</span>` : '';
  }

  function renderMocksPanel() {
    if (!failedEndpoints.size) {
      mocksList.innerHTML = '<div class="empty">No failed requests captured yet</div>';
      btnApplyMocks.classList.add('hidden');
      return;
    }

    const typeNames = Object.keys(parsedTsTypes);
    const typeOptions = typeNames.length
      ? '<option value="">-- select type --</option>' +
        typeNames.map(t => `<option value="${t}">${t}</option>`).join('')
      : '';

    mocksList.innerHTML = Array.from(failedEndpoints.entries()).map(([key, ep]) => {
      const existing = mockData[key] ? JSON.stringify(mockData[key], null, 2) : '';
      return `<div class="mock-endpoint" data-key="${key}">
        <div class="mock-head">
          <span class="mock-method">${ep.method}</span>
          <span class="mock-url" title="${ep.url}">${ep.url}</span>
          <span class="mock-status">${ep.status || ep.error || 'failed'}</span>
          ${typeOptions ? `<select class="type-select" data-key="${key}">${typeOptions}</select>` : ''}
        </div>
        <div class="mock-body">
          <textarea spellcheck="false" data-key="${key}" placeholder="Paste JSON mock response...">${existing}</textarea>
        </div>
      </div>`;
    }).join('');

    btnApplyMocks.classList.remove('hidden');

    mocksList.querySelectorAll('.type-select').forEach(sel => {
      sel.addEventListener('change', (e) => {
        const key = e.target.dataset.key;
        const typeName = e.target.value;
        if (!typeName) return;
        const scaffold = generateMockForType(typeName);
        if (scaffold !== null) {
          const ta = mocksList.querySelector(`textarea[data-key="${key}"]`);
          ta.value = JSON.stringify(scaffold, null, 2);
          mockData[key] = scaffold;
        }
      });
    });

    mocksList.querySelectorAll('textarea').forEach(ta => {
      ta.addEventListener('input', debounce((e) => {
        try {
          mockData[e.target.dataset.key] = JSON.parse(e.target.value);
        } catch {}
      }, 400));
    });
  }

  btnApplyMocks.addEventListener('click', () => loadBuild());

  // ---- Default Content ----
  ed.html.value = `<div class="hero">
  <nav>
    <div class="logo">Acme</div>
    <div class="nav-links">
      <a href="#">Features</a>
      <a href="#">Pricing</a>
      <a href="#" class="nav-cta">Get Started</a>
    </div>
  </nav>

  <div class="hero-content">
    <span class="chip">New Release</span>
    <h1>Build faster with <em>smarter</em> tools</h1>
    <p>A modern toolkit for teams that ship. Design, develop, and deploy with confidence.</p>
    <div class="hero-actions">
      <button class="btn-primary">Start Free Trial</button>
      <button class="btn-ghost">View Demo</button>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-icon" style="background:rgba(59,130,246,0.15);color:#3b82f6">&#9672;</div>
      <h3>Lightning Fast</h3>
      <p>Optimized build pipeline with sub-second hot reloads.</p>
    </div>
    <div class="card">
      <div class="card-icon" style="background:rgba(139,92,246,0.15);color:#8b5cf6">&#9830;</div>
      <h3>Type Safe</h3>
      <p>End-to-end type safety from database to frontend.</p>
    </div>
    <div class="card">
      <div class="card-icon" style="background:rgba(245,158,11,0.15);color:#f59e0b">&#9733;</div>
      <h3>Beautiful UI</h3>
      <p>Accessible components with built-in dark mode support.</p>
    </div>
  </div>
</div>`;

  ed.css.value = `:root {

  ed.js.value = `document.querySelector('.btn-primary')?.addEventListener('click', function() {

  // ---- Init ----
